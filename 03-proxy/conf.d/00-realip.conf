# nginx-proxy 의 http 컨텍스트로 include 됩니다 (nginx.conf 의 conf.d/*.conf).
#
# Cloudflare 뒤에 있으므로 nginx 가 보는 출발지 IP 는 전부 Cloudflare 엣지입니다.
# 그대로 두면 access log 와 rate limit 이 전부 CF IP 를 가리켜, 사고가 났을 때
# 누가 무엇을 했는지 되짚을 수 없습니다.
#
# 신뢰 대역이 0.0.0.0/0 인 것은 이 파일만 보면 위험해 보이지만, 이 리스너에
# 도달할 수 있는 것이 호스트의 cloudflared 하나뿐이라 안전합니다:
#   1. 80 번은 127.0.0.1 에만 게시됩니다 (docker-compose.yml)
#   2. SG 에 인바운드 규칙이 아예 없습니다 (01-foundation)
# 즉 여기 찍히는 출발지는 항상 docker 브리지 게이트웨이이고, 그 뒤의
# CF-Connecting-IP 는 Cloudflare 엣지가 넣어 터널로 그대로 전달한 값입니다.
set_real_ip_from 0.0.0.0/0;
real_ip_header CF-Connecting-IP;
