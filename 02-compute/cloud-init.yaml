#cloud-config
# 호스트를 "docker 가 돌고 /data 가 붙은 빈 상자" 상태까지만 만듭니다.
# 서비스 배포는 scripts/deploy.sh 가 담당합니다.

write_files:
  # docker 설치 전에 미리 놓아야 dockerd 가 처음부터 이 설정으로 뜹니다.
  # data-root 를 /data 로 옮기면 모든 named volume 이 영속 EBS 에 저장되므로
  # 각 compose stack 이 별도로 bind mount 경로를 신경 쓸 필요가 없습니다.
  - path: /etc/docker/daemon.json
    permissions: "0644"
    content: |
      {
        "data-root": "/data/docker",
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" }
      }

  # data-root 가 마운트 위에 있으므로 dockerd 는 /data 없이는 절대 뜨면 안 됩니다.
  # 이게 없으면 재부팅 시 dockerd 가 마운트를 이기고 루트 볼륨에 빈 data-root 를
  # 새로 만들어 버립니다. 볼륨은 멀쩡한데 컨테이너 데이터가 전부 사라진 것처럼 보이고,
  # 곧이어 /data 가 그 위에 마운트되면서 그 사본은 접근 불가 상태로 남습니다.
  - path: /etc/systemd/system/docker.service.d/data-mount.conf
    permissions: "0644"
    content: |
      [Unit]
      RequiresMountsFor=/data

  # 터널 토큰. cloudflared 는 --token 플래그 대신 TUNNEL_TOKEN 환경변수도 읽습니다.
  # 환경변수로 넘기는 이유는 명령줄에 두면 ps 로 아무 로컬 사용자나 읽을 수 있기
  # 때문입니다. 이 파일 자체는 0600 이고, 어차피 같은 값이 user_data 에도 있습니다.
  - path: /etc/cloudflared/token
    permissions: "0600"
    owner: "root:root"
    content: |
      TUNNEL_TOKEN=${cloudflare_tunnel_token}

  # SG 에 인바운드 규칙이 하나도 없으므로, 이 유닛이 뜨지 않으면 평상시 경로로는
  # 호스트에 들어갈 수 없습니다. Restart=always 로 두고, 실패해도 부팅은 계속되게
  # 합니다 (그때의 복구 경로는 SSM Session Manager 입니다: SSH_VIA=ssm make ssh).
  - path: /etc/systemd/system/cloudflared.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Cloudflare Tunnel
      Wants=network-online.target
      After=network-online.target

      [Service]
      Type=simple
      EnvironmentFile=/etc/cloudflared/token
      ExecStart=/usr/bin/cloudflared --no-autoupdate tunnel run
      Restart=always
      RestartSec=5
      # 터널은 SSH(localhost:22), Grafana(localhost:3000), nginx-proxy(localhost:80)
      # 로만 프록시하므로 루트 권한이 필요 없습니다. 토큰 파일은 0600 이지만
      # EnvironmentFile 은 systemd 가 권한을 내리기 전에 root 로 읽으므로
      # nobody 여도 뜹니다.
      # (혹시 이 데몬이 안 떠서 잠기면 SSH_VIA=ssm make ssh 로 들어와 확인하세요.)
      User=nobody
      Group=nogroup
      NoNewPrivileges=true
      PrivateTmp=true

      [Install]
      WantedBy=multi-user.target

  - path: /usr/local/bin/stack-init.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euxo pipefail

      # 부팅 직후에는 unattended-upgrades 가 dpkg 락을 쥐고 있을 수 있습니다.
      # Lock::Timeout 없이는 여기서 즉시 죽고 cloud-init 전체가 실패합니다.
      export DEBIAN_FRONTEND=noninteractive
      APT="apt-get -o DPkg::Lock::Timeout=600 -o Acquire::Retries=3 -y"

      # --- cloudflared ---
      # 평상시 접속 경로이므로 docker 보다 먼저 세웁니다. 아래 docker 설치는 몇
      # 분이 걸리는데, up.sh 의 SSH 대기가 그만큼 짧아집니다.
      #
      # 버전을 고정하지 않고 latest 를 받습니다. 인터넷에 붙는 유일한 상시
      # 데몬이라 패치가 자동으로 들어오는 쪽을 택했습니다 — 컨테이너 이미지에
      # digest 를 고정하지 않은 것과 같은 이유입니다.
      $APT update
      $APT install ca-certificates curl rsync
      curl -fsSL --retry 3 --retry-connrefused -o /tmp/cloudflared.deb \
        "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-$(dpkg --print-architecture).deb"
      $APT install /tmp/cloudflared.deb
      rm -f /tmp/cloudflared.deb

      systemctl daemon-reload
      systemctl enable --now cloudflared

      DEV=/dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_${replace(data_volume_id, "-", "")}

      # 볼륨 attach 는 인스턴스 부팅과 병렬로 일어나므로 기다립니다.
      for _ in $(seq 1 90); do
        [ -e "$DEV" ] && break
        sleep 2
      done
      test -e "$DEV"

      # 이미 파일시스템이 있으면 절대 건드리지 않습니다 (기존 데이터 보호).
      if ! blkid "$DEV" >/dev/null 2>&1; then
        mkfs.ext4 -L stack-data "$DEV"
      fi

      mkdir -p /data
      UUID=$(blkid -s UUID -o value "$DEV")
      # nofail: 볼륨에 문제가 생겨도 부팅은 끝까지 진행되어 SSH 로 들어와 고칠 수 있게.
      # dockerd 쪽은 위의 RequiresMountsFor 가 막아주므로 데이터는 안전합니다.
      if ! grep -q "$UUID" /etc/fstab; then
        echo "UUID=$UUID /data ext4 defaults,nofail 0 2" >> /etc/fstab
      fi
      systemctl daemon-reload
      mount -a
      mountpoint -q /data

      # DATA_VOLUME_SIZE 를 키우면 EBS 는 그 자리에서 커지지만 파일시스템은
      # 그대로입니다. terraform 은 성공했다고 하고 df 만 그대로라 알아채기 어렵습니다.
      # 온라인 resize 이고 이미 맞으면 "Nothing to do!" 로 조용히 끝납니다.
      # 단 runcmd 는 인스턴스당 1회라 재부팅으로는 안 돕니다 — 키우려면 재생성.
      resize2fs "$DEV" || echo "WARNING: resize2fs 실패 — /data 크기 확인 필요" >&2

      # t4g.small 은 2GiB 이고 Ubuntu 클라우드 이미지에는 swap 이 없습니다.
      # Prometheus head block 이 커지면 OOM killer 가 Prometheus 나 dockerd 를
      # 골라 죽이고, restart 정책 때문에 그 상태로 계속 튕깁니다.
      # 루트 볼륨에 둡니다 — /data 에 두면 언마운트를 막습니다.
      if ! swapon --show=NAME --noheadings | grep -qx /swapfile; then
        rm -f /swapfile
        fallocate -l 2G /swapfile
        chmod 600 /swapfile
        mkswap /swapfile
        grep -q "^/swapfile " /etc/fstab || echo "/swapfile none swap sw 0 0" >> /etc/fstab
        swapon /swapfile || echo "WARNING: swapon 실패 — OOM 위험" >&2
      fi

      # --- docker ---
      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL --retry 3 --retry-connrefused https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc

      . /etc/os-release
      cat > /etc/apt/sources.list.d/docker.sources <<EOF
      Types: deb
      URIs: https://download.docker.com/linux/ubuntu
      Suites: $${UBUNTU_CODENAME:-$VERSION_CODENAME}
      Components: stable
      Architectures: $(dpkg --print-architecture)
      Signed-By: /etc/apt/keyrings/docker.asc
      EOF

      $APT update
      $APT install docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

      usermod -aG docker ubuntu

      # deploy.sh 가 compose 파일을 rsync 해 넣는 곳 (루트 볼륨, 매번 덮어씀)
      install -d -o ubuntu -g ubuntu /opt/stack

runcmd:
  # 복구 경로를 가장 먼저 세웁니다. 아래 stack-init.sh 는 set -e 라 중간에 죽을 수
  # 있고(예: cloudflared 다운로드 실패), 그러면 cloudflared 도 docker 도 없는
  # 호스트가 남습니다. 그 상태에서 들어갈 수 있는 유일한 길이 SSM 입니다.
  #
  # Ubuntu 의 AWS 이미지에는 amazon-ssm-agent 가 snap 으로 이미 들어 있고 부팅
  # 시 자동으로 뜹니다. 이 줄은 그 전제가 깨졌을 때를 위한 보험이라, 어느 단계가
  # 실패해도 부팅을 막지 않도록 전부 실패를 삼킵니다.
  - - bash
    - -c
    - >-
      snap list amazon-ssm-agent >/dev/null 2>&1
      || snap install amazon-ssm-agent --classic
      || true;
      snap start --enable amazon-ssm-agent || true
  - [bash, /usr/local/bin/stack-init.sh]
