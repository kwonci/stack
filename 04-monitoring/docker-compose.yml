# 04-monitoring
# 셋 다 인터넷에 직접 노출되지 않습니다.
# Grafana 는 관리 도구이므로 공개 경로(nginx-proxy)가 아니라 cloudflared 터널로만
# 닿습니다. 인증은 Grafana 로그인 앞에 Cloudflare Access 가 한 겹 더 있습니다.
# Prometheus 와 node-exporter 는 호스트 밖으로 나가지 않습니다.

# 디렉토리 이름이 바뀌어도 볼륨이 고아가 되지 않도록 프로젝트 이름을 고정합니다.
name: monitoring

services:
  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # retention 은 prometheus.yml 로 옮겼습니다 — CLI 플래그 쪽이 deprecated 이고
      # 설정 파일 값이 우선합니다. 다만 retention 은 기동 시에만 반영되므로,
      # 바꾸려면 컨테이너를 다시 만들어야 합니다(make deploy 가 알아서 합니다).
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # host network 에 있는 node-exporter 를 이름으로 찾아가기 위해.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      # data-root 가 /var/lib/docker 가 아니라 /data/docker 라서 기본 제외
      # 패턴에 걸리지 않습니다. 그대로 두면 컨테이너마다 shm tmpfs 가
      # node_filesystem_* 시계열로 잡혀 배포할 때마다 series 가 늘어납니다.
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|run/credentials/.+|sys|var/lib/docker/.+|var/lib/containers/storage/.+|data/docker/.+)($|/)
    pid: host
    # bridge 네트워크에 두면 /proc/net 이 컨테이너의 network namespace 로
    # 해석되어 node_network_* / node_netstat_* 가 veth 통계를 보고합니다.
    # 호스트 지표를 얻으려면 host network 여야 합니다.
    # 9100 은 호스트의 모든 인터페이스에 열리지만 SG 에 인바운드 규칙이 하나도
    # 없어 외부에서는 닿지 않습니다. 호스트의 다른 컨테이너는 여전히 읽을 수 있습니다.
    network_mode: host
    volumes:
      - /:/host:ro,rslave

  grafana:
    image: grafana/grafana:13.1.3
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    # 루프백에만 게시합니다. 호스트에서 도는 cloudflared 가 이 주소로 프록시하고,
    # 그 밖에서는 어떤 인터페이스로도 닿지 않습니다. nginx-proxy 를 거치지 않으므로
    # VIRTUAL_HOST 도 없습니다 — 터널이 이 주소로 직접 프록시합니다.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}
      # 개인 stack 이므로 가입은 막습니다.
      GF_USERS_ALLOW_SIGN_UP: "false"
      # 브라우저와 Cloudflare 사이는 항상 HTTPS 이므로 세션 쿠키를 평문 요청에
      # 실어보내지 않습니다. cloudflared -> Grafana 구간이 평문 HTTP 인 것은
      # 호스트 루프백 안이라 상관없습니다.
      GF_SECURITY_COOKIE_SECURE: "true"
    networks:
      - monitoring

volumes:
  prometheus-data:
  grafana-data:

networks:
  monitoring:
